<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Tic Tac Toe</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#090016;color:#fff}
  body{
    background:
      radial-gradient(circle at 50% 22%, rgba(0,119,255,.28), transparent 25%),
      radial-gradient(circle at 10% 80%, rgba(184,0,255,.28), transparent 32%),
      radial-gradient(circle at 90% 65%, rgba(0,65,255,.18), transparent 35%),
      linear-gradient(145deg,#09001c,#17004b 48%,#08001a);
  }
  .app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
  .screen{width:min(100%,520px);height:100%;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
  .hidden{display:none!important}

  /* Home */
  #home h1{
    margin:0 0 28px;
    font-size:clamp(42px,12vw,68px);
    letter-spacing:2px;
    text-transform:uppercase;
    text-shadow:0 0 8px #18a8ff,0 0 24px #0077ff,0 0 50px #8a00ff;
  }
  .logo{
    width:150px;height:150px;border-radius:38px;margin-bottom:34px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(0,140,255,.25),rgba(155,0,255,.16));
    border:2px solid rgba(55,172,255,.6);
    box-shadow:0 0 24px rgba(0,145,255,.55), inset 0 0 35px rgba(98,0,255,.35);
  }
  .logo span{font-size:82px;color:#fff;text-shadow:0 0 10px #00aaff,0 0 28px #008cff}
  .btn{
    border:0;border-radius:18px;padding:17px 48px;font-size:22px;font-weight:800;
    color:#fff;background:linear-gradient(90deg,#075fff,#8a18ff);
    box-shadow:0 0 15px rgba(0,126,255,.7),0 0 30px rgba(138,24,255,.35);
    cursor:pointer;min-width:220px;
  }
  .btn:active{transform:scale(.97)}

  /* Game */
  #game{justify-content:flex-start;padding-top:34px}
  .top{
    width:100%;display:flex;flex-direction:column;align-items:center;margin-bottom:24px
  }
  .versus{
    display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:9px
  }
  .mark{font-size:78px;line-height:.75;font-weight:300}
  .mark.o{color:#dfe8ff;text-shadow:0 0 12px #398dff,0 0 28px #0070ff}
  .mark.x{color:#fff;text-shadow:0 0 12px #ff6bff,0 0 28px #8b00ff}
  .vs{font-size:19px;font-weight:900}
  .labels{display:flex;gap:82px;font-size:13px;font-weight:800;letter-spacing:.4px}
  .labels span:first-child{color:#0797ff;text-shadow:0 0 10px #007dff}
  .labels span:last-child{color:#ffc95c}

  .status{
    min-height:32px;font-size:17px;font-weight:700;text-align:center;
    color:#d8e6ff;text-shadow:0 0 10px rgba(64,146,255,.8);margin-bottom:14px
  }
  .board-wrap{width:min(92vw,440px);aspect-ratio:1;position:relative;padding:5px;border-radius:23px}
  .board{
    width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    border:3px solid rgba(221,26,255,.8);border-radius:21px;overflow:hidden;
    background:rgba(10,12,72,.28);
    box-shadow:0 0 12px rgba(212,0,255,.75),0 0 35px rgba(0,83,255,.18),inset 0 0 30px rgba(0,100,255,.2);
  }
  .cell{
    position:relative;border:2px solid rgba(20,105,220,.45);background:rgba(3,31,93,.28);
    display:grid;place-items:center;cursor:pointer;
  }
  .cell:hover{background:rgba(0,117,255,.12)}
  .cell span{font-size:clamp(64px,19vw,108px);line-height:1;font-weight:300;transform:translateY(-2px)}
  .cell.o span{color:#eef3ff;text-shadow:0 0 8px #53b4ff,0 0 23px #0078ff,0 0 42px #005dff}
  .cell.x span{color:#e8dff0;text-shadow:0 0 8px #ffb0ff,0 0 20px #8b1cff,0 0 40px #6400ff}
  .win-line{
    position:absolute;left:6%;width:88%;height:6px;border-radius:8px;
    background:#dff7ff;box-shadow:0 0 8px #fff,0 0 18px #00a8ff,0 0 35px #0075ff;
    transform-origin:center;pointer-events:none;display:none;z-index:5
  }
  .win-line.show{display:block}
  .win-line.diag1{top:50%;transform:translateY(-50%) rotate(45deg)}
  .win-line.diag2{top:50%;transform:translateY(-50%) rotate(-45deg)}
  .win-line.row0{top:16.66%;transform:translateY(-50%)}
  .win-line.row1{top:50%;transform:translateY(-50%)}
  .win-line.row2{top:83.33%;transform:translateY(-50%)}
  .win-line.col0{left:16.66%;top:6%;width:6px;height:88%;transform:none}
  .win-line.col1{left:50%;top:6%;width:6px;height:88%;transform:translateX(-50%)}
  .win-line.col2{left:83.33%;top:6%;width:6px;height:88%;transform:translateX(-50%)}

  .bottom{margin-top:28px;display:flex;gap:14px}
  .small-btn{border:1px solid rgba(90,180,255,.55);background:rgba(12,35,105,.45);color:#dff3ff;border-radius:12px;padding:10px 18px;font-weight:700;box-shadow:0 0 12px rgba(0,130,255,.2);cursor:pointer}
  .small-btn:active{transform:scale(.96)}
  .result{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10;
    background:rgba(3,0,25,.65);backdrop-filter:blur(3px)
  }
  .result.show{display:flex}
  .result-card{
    width:min(88vw,350px);padding:30px 20px;border-radius:25px;text-align:center;
    background:linear-gradient(145deg,rgba(12,25,100,.95),rgba(47,0,95,.94));
    border:2px solid #7f42ff;box-shadow:0 0 25px #541dff,0 0 55px rgba(0,119,255,.35)
  }
  .result-card h2{font-size:34px;margin:0 0 20px;text-shadow:0 0 18px #42a9ff}
  .result-card .btn{min-width:180px;padding:13px 28px;font-size:18px}

  @media(max-height:650px){
    #game{padding-top:12px}
    .top{margin-bottom:10px}.board-wrap{width:min(82vh,400px)}.bottom{margin-top:12px}
    .mark{font-size:60px}.labels{gap:62px}
  }
</style>
</head>
<body>
<div class="app">

  <section id="home" class="screen">
    <div class="logo"><span>○</span></div>
    <h1>Tic Tac Toe</h1>
    <button class="btn" id="startBtn">START GAME</button>
  </section>

  <section id="game" class="screen hidden">
    <div class="top">
      <div class="versus">
        <div class="mark o">○</div><div class="vs">VS</div><div class="mark x">×</div>
      </div>
      <div class="labels"><span>PLAYER</span><span>COMPUTER</span></div>
    </div>

    <div class="status" id="status">Your turn — place O</div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="win-line" id="winLine"></div>
    </div>

    <div class="bottom">
      <button class="small-btn" id="restartBtn">↻ Restart</button>
      <button class="small-btn" id="homeBtn">⌂ Home</button>
    </div>

    <div class="result" id="result">
      <div class="result-card">
        <h2 id="resultTitle">YOU WIN!</h2>
        <button class="btn" id="againBtn">PLAY AGAIN</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const home = document.getElementById('home');
  const game = document.getElementById('game');
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const winLine = document.getElementById('winLine');
  const result = document.getElementById('result');
  const resultTitle = document.getElementById('resultTitle');

  let cells = Array(9).fill('');
  let gameOver = false;
  let thinking = false;

  const wins = [
    [0,1,2,'row0'], [3,4,5,'row1'], [6,7,8,'row2'],
    [0,3,6,'col0'], [1,4,7,'col1'], [2,5,8,'col2'],
    [0,4,8,'diag1'], [2,4,6,'diag2']
  ];

  function render() {
    boardEl.innerHTML = '';
    cells.forEach((v, i) => {
      const cell = document.createElement('button');
      cell.className = 'cell' + (v ? ' ' + v.toLowerCase() : '');
      cell.setAttribute('aria-label', v ? v : 'Empty cell');
      cell.innerHTML = v ? '<span>' + (v === 'O' ? '○' : '×') + '</span>' : '';
      cell.addEventListener('click', () => playerMove(i));
      boardEl.appendChild(cell);
    });
  }

  function getWinner(arr) {
    for (const w of wins) {
      if (arr[w[0]] && arr[w[0]] === arr[w[1]] && arr[w[1]] === arr[w[2]]) return w;
    }
    if (arr.every(Boolean)) return 'draw';
    return null;
  }

  function showWinLine(win) {
    winLine.className = 'win-line show ' + win[3];
  }

  function endGame(win) {
    gameOver = true;
    thinking = false;
    if (win === 'draw') {
      statusEl.textContent = "It's a draw!";
      resultTitle.textContent = "DRAW!";
    } else {
      showWinLine(win);
      const winner = cells[win[0]];
      statusEl.textContent = winner === 'O' ? 'You won!' : 'Computer won!';
      resultTitle.textContent = winner === 'O' ? 'YOU WIN!' : 'COMPUTER WINS!';
    }
    setTimeout(() => result.classList.add('show'), 450);
  }

  function playerMove(i) {
    if (gameOver || thinking || cells[i]) return;
    cells[i] = 'O';
    render();
    const win = getWinner(cells);
    if (win) return endGame(win);

    thinking = true;
    statusEl.textContent = 'Computer is thinking…';
    setTimeout(computerMove, 420);
  }

  // Unbeatable minimax computer
  function minimax(arr, isMax) {
    const win = getWinner(arr);
    if (win) {
      if (win === 'draw') return 0;
      return arr[win[0]] === 'X' ? 10 : -10;
    }
    if (isMax) {
      let best = -Infinity;
      arr.forEach((v,i) => {
        if (!v) { arr[i]='X'; best=Math.max(best,minimax(arr,false)); arr[i]=''; }
      });
      return best;
    } else {
      let best = Infinity;
      arr.forEach((v,i) => {
        if (!v) { arr[i]='O'; best=Math.min(best,minimax(arr,true)); arr[i]=''; }
      });
      return best;
    }
  }

  function computerMove() {
    if (gameOver) return;
    let bestScore = -Infinity, bestMoves = [];
    cells.forEach((v,i) => {
      if (!v) {
        cells[i]='X';
        const score=minimax(cells,false);
        cells[i]='';
        if (score > bestScore) { bestScore=score; bestMoves=[i]; }
        else if (score === bestScore) bestMoves.push(i);
      }
    });
    // A tiny bit of randomness when equally good moves exist
    const move = bestMoves[Math.floor(Math.random()*bestMoves.length)];
    cells[move]='X';
    render();
    const win=getWinner(cells);
    if (win) return endGame(win);
    thinking=false;
    statusEl.textContent='Your turn — place O';
  }

  function startGame() {
    home.classList.add('hidden');
    game.classList.remove('hidden');
    resetGame();
  }

  function resetGame() {
    cells=Array(9).fill('');
    gameOver=false; thinking=false;
    winLine.className='win-line';
    result.classList.remove('show');
    statusEl.textContent='Your turn — place O';
    render();
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', resetGame);
  document.getElementById('againBtn').addEventListener('click', resetGame);
  document.getElementById('homeBtn').addEventListener('click', () => {
    result.classList.remove('show');
    game.classList.add('hidden');
    home.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
