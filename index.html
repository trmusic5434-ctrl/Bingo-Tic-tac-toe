<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #090015; color: #fff; }
    body { background: radial-gradient(circle at 50% 22%, rgba(0, 110, 255, .28), transparent 25%), radial-gradient(circle at 10% 80%, rgba(184, 0, 255, .28), transparent 32%), radial-gradient(circle at 90% 65%, rgba(0, 65, 255, .18), transparent 35%), linear-gradient(145deg, #03001c, #17004b 48%, #08001a); }
    .app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
    .screen { width: min(100%, 520px); height: 100%; padding: 24px 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .hidden { display: none !important; }
    #home h1 { margin: 0 0 28px; font-size: clamp(42px, 12vw, 68px); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 8px #18a8ff, 0 0 24px #0077ff, 0 0 50px #8a00ff; }
    .logo { width: 150px; height: 150px; border-radius: 38px; margin-bottom: 34px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(0, 140, 255, .25), rgba(155, 0, 255, .16)); border: 2px solid rgba(55, 172, 255, .63); box-shadow: 0 0 24px rgba(0, 145, 255, .55), inset 0 0 35px rgba(98, 0, 255, .35); }
    .logo span { font-size: 82px; color: #fff; text-shadow: 0 0 10px #00aaff, 0 0 28px #008cff; }
    .btn { border: 0; border-radius: 18px; padding: 17px 48px; font-size: 22px; font-weight: 800; color: #fff; background: linear-gradient(90deg, #075fff, #8a18ff); box-shadow: 0 0 15px rgba(0, 126, 255, .7), 0 0 30px rgba(138, 24, 255, .35); cursor: pointer; min-width: 220px; }
  </style>
</head>
<body>
  <div class="app">
    <div id="home" class="screen">
      <div class="logo"><span>❌</span></div>
      <h1>TIC TAC TOE</h1>
      <button class="btn">PLAY</button>
    </div>
  </div>
</body>
</html>
